<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo_techroxx.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techroxx Ecosystem | Bridging Industry, Innovation, Talent & Technology</title>
    <meta name="description" content="Techroxx is a technology ecosystem that bridges academics, industry, innovation, and employability through advanced technologies, real-world projects, industry solutions, events, mentorship, talent development, and community impact." />
    
    <!-- Google Fonts Preconnect and High-Performance Load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Critical Asset Preloading for LCP Boost -->
    <link rel="preload" as="image" href="/logo_techroxx.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-bg-dark.webp" fetchpriority="high" />
    
    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2173144997531852" crossorigin="anonymous"></script>

    <script>
      (function() {
        const saved = localStorage.getItem('theme') || 'system';
        let active = saved;
        if (saved === 'system') {
          active = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', active);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
